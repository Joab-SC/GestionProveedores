name: gestionproveedores

services:
  oracle-free:
    image: gvenzl/oracle-free:latest
    container_name: oracle-db
    ports:
      - "${ORACLE_PORT:?ORACLE_PORT debe estar definida}:1521"
    environment:
      ORACLE_PASSWORD: "${ORACLE_PASSWORD:?ORACLE_PASSWORD debe estar definida}"
      APP_USER: "${APP_USER:?APP_USER debe estar definida}"
      APP_USER_PASSWORD: "${APP_USER_PASSWORD:?APP_USER_PASSWORD debe estar definida}"
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
